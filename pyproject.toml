[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "crypto_bot"
version = "0.1.0"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["."]
include = ["crypto_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
