mode: intraday

exchange:
  name: binance
  market: futures
  testnet: false

backtest:
  symbols: ["BTCUSDT", "ETHUSDT", "SOLUSDT"]
  timeframes: ["1m", "5m", "15m", "1h"]
  primary_tf: "5m"
  confirm_tf: "15m"
  trend_tf: "1h"
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  initial_capital_per_strategy: 100.0
  fees_pct: 0.0002
  slippage_pct: 0.0003

leverage:
  max: 5
  default: 3

risk:
  max_position_pct: 0.40
  stop_loss_atr_multiplier: 1.0
  take_profit_atr_multiplier: 2.5
  max_drawdown_pct: 0.10
  max_daily_loss_pct: 0.03
  max_trades_per_day: 5
  session_filter: true

optimization:
  trials: 300
  sampler: "TPE"
  objective: "composite"
  min_trades_per_year: 200

walk_forward:
  train_months: 3
  test_months: 1
  step_months: 1

promotion_criteria:
  min_sharpe_oos: 1.0
  max_drawdown_pct: 0.15
  min_profit_factor: 1.3
  min_trades_per_year: 200
  max_is_oos_divergence: 2.0
