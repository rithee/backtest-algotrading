mode: swing

exchange:
  name: binance
  market: futures
  testnet: false

backtest:
  symbols: ["BTCUSDT", "ETHUSDT"]
  timeframes: ["4h", "1d"]
  primary_tf: "4h"
  confirm_tf: "1d"
  start_date: "2020-01-01"
  end_date: "2024-12-31"
  initial_capital_per_strategy: 100.0
  fees_pct: 0.001
  slippage_pct: 0.0005

leverage:
  max: 5
  default: 2

risk:
  max_position_pct: 0.30
  stop_loss_atr_multiplier: 2.0
  take_profit_atr_multiplier: 3.5
  max_drawdown_pct: 0.20
  options_expiry_aware: true
  weekly_max_pain_target: true

optimization:
  trials: 500
  sampler: "TPE"
  objective: "composite"
  min_trades_per_year: 30

walk_forward:
  train_months: 12
  test_months: 3
  step_months: 3

promotion_criteria:
  min_sharpe_oos: 1.0
  max_drawdown_pct: 0.25
  min_profit_factor: 1.3
  min_trades_per_year: 30
  max_is_oos_divergence: 2.0
